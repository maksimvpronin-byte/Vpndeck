name: Release

# A v* tag builds the APKs, signs them with the release key from the repo
# secrets and leaves a DRAFT release. The in-app updater only sees published
# releases, so nothing reaches phones until the draft is published:
#   gh release edit vX.Y.Z --draft=false --latest
# "Run workflow" builds the same APKs without a release (they stay on the run).
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Server tests and static checks
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...

  build:
    needs: server
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NDK_VERSION: 28.0.13004108
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/^VERSION_NAME=//p' android/version.properties)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says ${GITHUB_REF_NAME#v}, android/version.properties says $v."
            exit 1
          fi
          echo "Building $v"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Go for the core (gomobile + sing-box), separate from server/go.mod: the core's
      # linkname tricks follow the Go its sing-box version supports. Bump it together
      # with SING_BOX_VERSION in scripts/build-libbox.sh (that also refreshes the cache).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The core only changes when the sing-box version or the build recipe does.
      - name: Cache the core
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Build the core
        if: steps.libbox.outputs.cache-hit != 'true'
        run: scripts/build-libbox.sh

      - name: Set up the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "::error::Release key secrets are not set — a release can't be signed."
              exit 1
            fi
            echo "::warning::No release key in secrets; this test build is debug-signed."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/vpndeck-release.jks
          {
            echo "storeFile=keystore/vpndeck-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=vpndeck"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/keystore.properties

      - name: Android tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Build the APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/
          extra=""; [ "${GITHUB_REF_TYPE}" = tag ] || extra="--allow-unsigned"
          scripts/verify-apks.sh "${{ steps.version.outputs.version }}" out $extra
          (cd out && sha256sum *.apk > SHA256SUMS)

      - name: Remove the key from the runner
        if: always()
        run: rm -rf android/keystore android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: vpndeck-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vpndeck-${{ needs.build.outputs.version }}
          path: out

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # "What's new" comes from the annotated tag's message (scripts/release.sh writes it).
          git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          whatsnew=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/^-----BEGIN/,$d')
          # One source of truth for the release key's certificate: the check that enforced it.
          cert=$(sed -n 's/^EXPECTED_CERT=//p' scripts/verify-apks.sh)
          [ -n "$cert" ] || { echo "::error::EXPECTED_CERT not found in scripts/verify-apks.sh"; exit 1; }
          {
            echo "${whatsnew:-Обновление VpnDeck.}"
            echo
            echo '**Какой файл скачать вручную:** `arm64-v8a` — почти все современные телефоны; `universal` — если не уверены.'
            echo 'Приложение с версии 0.1.3 обновляется само, после публикации этого черновика.'
            echo
            echo 'SHA-256:'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo "Сертификат подписи (SHA-256): \`$cert\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "VpnDeck $VERSION" --notes-file notes.md
